name: Rollback VPS

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Commit SHA or tag to roll back to"
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback to ${{ inputs.git_ref }}
        run: bash Infrastructure/docker/deploy-incremental.sh "${{ secrets.VPS_HOST }}" "${{ inputs.git_ref }}"
