apiVersion: 1
contactPoints:
  - orgId: 1
    name: Telegram
    receivers:
      - uid: telegram-castology
        type: telegram
        settings:
          bottoken: "8659590709:AAEf_wtNV_dJzKJ-V91-pyY9-WjTl4rbbwY"
          chatid: "8718879671"
          message: |
            {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} *{{ .CommonLabels.alertname }}*
            {{ range .Alerts }}
            • {{ .Annotations.summary }}
            {{ if .Annotations.description }}  {{ .Annotations.description }}{{ end }}
            {{ end }}
          parse_mode: Markdown
        disableResolveMessage: false
