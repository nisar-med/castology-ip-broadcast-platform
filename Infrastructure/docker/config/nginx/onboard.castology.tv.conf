server {
    listen 80;
    server_name onboard.castology.tv;
    # HTTPS is expected to terminate upstream (Cloudflare / edge proxy).

    root /var/www/onboard;
    index index.html;

    location = /api/collections/_superusers/auth-with-password {
        limit_req zone=onboard_auth burst=2 nodelay;
        proxy_pass         http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=onboard_api burst=20 nodelay;
        proxy_pass         http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /_/ {
        proxy_pass         http://pocketbase:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
