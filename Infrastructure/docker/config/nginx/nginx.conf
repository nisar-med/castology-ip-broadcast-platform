user  nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   15;
    keepalive_requests  100;
    types_hash_max_size 2048;
    server_tokens       off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip off;

    # Brute-force protection for onboard portal admin auth endpoint.
    limit_req_zone $binary_remote_addr zone=onboard_auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=onboard_api:20m rate=60r/m;

    include /etc/nginx/conf.d/*.conf;
}
